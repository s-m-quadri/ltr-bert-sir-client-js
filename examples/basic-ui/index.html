<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIR mini demo</title>
    <link rel="stylesheet" href="../../dist/ui/theme.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0c10;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { mountMiniSirApp } from "../../dist/ui/index.js";

      const params = new URLSearchParams(location.search);
      const baseUrl = params.get("api") || undefined;

      mountMiniSirApp(document.getElementById("app"), { baseUrl });
    </script>
  </body>
</html>
